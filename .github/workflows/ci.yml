name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # What users get from npm, not the working tree: catches a missing file
      # in `files`, a broken bin, or exports that do not resolve.
      - name: Install the packed tarball and run it
        run: |
          tarball="$GITHUB_WORKSPACE/$(npm pack --silent)"
          fixtures="$GITHUB_WORKSPACE/test/fixtures"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$tarball"
          npx dsv --help
          npx dsv -s "$fixtures/person-shape.ttl" "$fixtures/valid.jsonld"
          for format in text json markdown; do
            # An invalid document must exit 1 - not 0, and not a crash.
            code=0
            npx dsv -s "$fixtures/person-shape.ttl" -f "$format" "$fixtures/invalid.jsonld" || code=$?
            [ "$code" -eq 1 ] || { echo "::error::--format $format exited $code, expected 1"; exit 1; }
          done
          node --input-type=module -e "
            import { validate } from '@theodi/data-standard-validator'
            const r = await validate({ shapes: '$fixtures/person-shape.ttl', data: '$fixtures/valid.jsonld' })
            if (!r.conforms) process.exit(1)
          "
